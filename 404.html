<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Bella Modas</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .pagina-404 {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: linear-gradient(135deg, var(--vinho) 0%, var(--rosa-escuro) 55%, var(--rosa) 100%);
        color: var(--branco);
        padding: 3rem 1.5rem;
      }
      .pagina-404 img {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 4px dashed rgba(255, 255, 255, 0.55);
        padding: 8px;
        margin: 0 auto 1.6rem;
      }
      .pagina-404 h1 {
        font-size: clamp(2.4rem, 6vw, 3.4rem);
        color: var(--branco);
        margin-bottom: 0.6rem;
      }
      .pagina-404 p {
        color: var(--creme-forte);
        max-width: 420px;
        margin: 0 auto 2rem;
      }
    </style>
  </head>
  <body>
    <section class="pagina-404">
      <div>
        <img src="logo.png" alt="Bella Modas" />
        <span class="eyebrow" style="color: var(--dourado);">Erro 404</span>
        <h1>Essa página saiu de moda</h1>
        <p>Não encontramos o que você procurava. Que tal voltar pra loja e dar uma olhada nas novidades?</p>
        <a href="index.html" class="btn btn-primary">Voltar para a loja</a>
      </div>
    </section>
  </body>
</html>
